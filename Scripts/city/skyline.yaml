# Mix ratios are weights, not percents: 40, 30, 30 is the same as 4, 3, 3.
# city is the fallback. regions.<name> wins when assign_districts is given that
# region. downtown here is a region name, not the downtown character.
mix:
  city:
    tech: 20
    historic_old: 15
    eclectic_mix: 12
    apartments_condos: 15
    houses: 15
    green_renewable: 8
    brand_new: 8
    industrial_commercial: 5
    utilities: 2
  regions:
    downtown:
      tech: 40
      eclectic_mix: 30
      apartments_condos: 30

# The one-block study. Four readings of the same lots and the same height field.
variations:
  - prewar_masonry
  - glass_curtain
  - art_deco
  - modern_mixed

# Centreline rectangle of the study block (metres, origin at the crossing of the two avenues).
block:
  name: loop_sample
  x0: -60
  x1: 60
  y0: -45
  y1: 45
  district:
    - [-90, -75]
    - [90, -75]
    - [90, 75]
    - [-90, 75]
  hero_anchor: [0, -18]
  silhouette:
    origin: [-60, 0]
    axis: [1, 0]
    length: 120
    samples: [46, 74, 176, 98, 50]
    mode: soft_max
  # class, oneway, lanes, core. core is the downtown section: wide paved walk, tree grates.
  streets:
    south:
      class: major
      oneway: true
      lanes: 3
      core: true
      name: South Avenue
    north:
      class: mid
      oneway: false
      lanes: 2
      core: false
      name: North Avenue
    east:
      class: minor
      oneway: true
      lanes: 1
      core: true
      name: East Street
    west:
      class: major
      oneway: true
      lanes: 3
      core: true
      name: West Avenue
