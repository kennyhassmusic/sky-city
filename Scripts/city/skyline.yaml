# Sky City skyline controls.
#
# This is the artist file the generator reads. The Map Designer will edit the same
# fields per district. When Config/SkyCity/skyline.yaml exists it wins (that folder is
# maintainer-gated, so the checked-in copy lives here and the loader looks there first).
#
# Heights are metres. A district in city_model.json overrides any field below.
# The same seed and the same file rebuild the same buildings.

version: 1
seed: 1408

# Applied under every character, then the district overrides them.
defaults:
  base_height_m: 28
  edge_height_m: 12
  falloff: smoothstep
  reach_m: 0
  coverage: 0.72
  far: 6
  noise_amplitude_m: 8
  floor_height_m: 3.4
  hero_count: 0
  hero_min_spacing_m: 80
  hero_height_rank_m: [80]
  hero_anchor: [0, 0]
  centre: [0, 0]
  silhouette:
    origin: [0, 0]
    axis: [1, 0]
    length: 1
    samples: [28]
    mode: soft_max

# Zone character. add_district(character=...) copies style, trees and skyline from here.
characters:
  downtown:
    style: prewar_masonry
    trees: [linden, elm]
    skyline:
      base_height_m: 52
      edge_height_m: 34
      falloff: smoothstep
      reach_m: 80
      coverage: 0.8
      far: 16
      noise_amplitude_m: 14
      hero_count: 1
      hero_min_spacing_m: 70
      hero_height_rank_m: [168, 120, 96]
      floor_height_m: 3.5
  residential:
    style: brick_walkup
    trees: [liveoak, elm]
    skyline:
      base_height_m: 11
      edge_height_m: 7
      coverage: 0.55
      far: 1.6
      noise_amplitude_m: 3
      hero_count: 0
  industrial:
    style: industrial
    trees: [honeylocust]
    skyline:
      base_height_m: 12
      edge_height_m: 8
      coverage: 0.62
      far: 2.2
      noise_amplitude_m: 3
      hero_count: 0
  waterfront:
    style: glass_curtain
    trees: [linden, liveoak]
    skyline:
      base_height_m: 40
      edge_height_m: 18
      coverage: 0.7
      far: 10
      noise_amplitude_m: 10
      hero_count: 1
      hero_height_rank_m: [110]
  park:
    style: texas_lowrise
    trees: [liveoak]
    skyline:
      base_height_m: 0
      coverage: 0
      far: 0
      hero_count: 0

# First-class district types. Heights are metres [low, high]. buildings name grammar
# styles. materials name CC0 slots. pack is the folder under Scripts/city/packs:
# packs/<type>/manifest.json, filled in later by an AI texture set. wear is 0
# (just built) to 1 (heavily weathered). furniture is what the streetscape may
# scatter once a district has a type; trees come from vegetation.
# A mix on a type is a sub-mix: blocks inside that district are painted from it.
district_types:
  brand_new:
    buildings: [glass_curtain, modern_mixed]
    height_m: [18, 72]
    roofs: [flat, setback]
    materials: [concrete, glass, metal]
    pack: brand_new
    vegetation: [honeylocust, linden]
    wear: 0.05
    furniture: [lamp, bench, bin, grate]
  historic_old:
    buildings: [prewar_masonry, art_deco, brick_walkup]
    height_m: [12, 48]
    roofs: [parapet, mansard, gabled]
    materials: [brick, plaster]
    pack: historic_old
    vegetation: [elm, linden]
    wear: 0.75
    furniture: [lamp, bench, hydrant, bin]
  eclectic_mix:
    buildings: [prewar_masonry, modern_mixed, art_deco, brick_walkup]
    height_m: [10, 55]
    roofs: [parapet, flat, gabled, mansard]
    materials: [brick, concrete, plaster]
    pack: eclectic_mix
    vegetation: [linden, elm, liveoak]
    wear: 0.45
    furniture: [lamp, bench, bin, grate]
    mix:
      historic_old: 40
      brand_new: 35
      tech: 25
  tech:
    buildings: [glass_curtain, modern_mixed]
    height_m: [24, 96]
    roofs: [flat, setback]
    materials: [glass, metal, concrete]
    pack: tech
    vegetation: [honeylocust]
    wear: 0.08
    furniture: [lamp, bin, grate]
  green_renewable:
    buildings: [modern_mixed, texas_lowrise]
    height_m: [8, 36]
    roofs: [hipped, flat]
    materials: [plaster, concrete]
    pack: green_renewable
    vegetation: [liveoak, honeylocust]
    wear: 0.15
    furniture: [lamp, bench, grate]
  houses:
    buildings: [texas_lowrise, brick_walkup]
    height_m: [6, 12]
    roofs: [gabled, hipped]
    materials: [brick, plaster]
    pack: houses
    vegetation: [liveoak, elm]
    wear: 0.35
    furniture: [lamp, bin]
  apartments_condos:
    buildings: [modern_mixed, brick_walkup, glass_curtain]
    height_m: [14, 42]
    roofs: [flat, parapet, setback]
    materials: [concrete, brick, glass]
    pack: apartments_condos
    vegetation: [linden, honeylocust]
    wear: 0.2
    furniture: [lamp, bench, bin, grate]
  industrial_commercial:
    buildings: [industrial, modern_mixed]
    height_m: [8, 24]
    roofs: [flat, gabled]
    materials: [concrete, metal]
    pack: industrial_commercial
    vegetation: [honeylocust]
    wear: 0.55
    furniture: [lamp, bin]
  utilities:
    buildings: [industrial]
    height_m: [6, 18]
    roofs: [flat, gabled]
    materials: [concrete, metal]
    pack: utilities
    vegetation: [honeylocust]
    wear: 0.4
    furniture: [lamp]

# Mix ratios are weights, not percents: 40, 30, 30 is the same as 4, 3, 3.
# city is the fallback. regions.<name> wins when assign_districts is given that
# region. downtown here is a region name, not the downtown character.
mix:
  city:
    tech: 20
    historic_old: 15
    eclectic_mix: 12
    apartments_condos: 15
    houses: 15
    green_renewable: 8
    brand_new: 8
    industrial_commercial: 5
    utilities: 2
  regions:
    downtown:
      tech: 40
      eclectic_mix: 30
      apartments_condos: 30

# The one-block study. Four readings of the same lots and the same height field.
variations:
  - prewar_masonry
  - glass_curtain
  - art_deco
  - modern_mixed

# Centreline rectangle of the study block (metres, origin at the crossing of the two avenues).
block:
  name: loop_sample
  x0: -60
  x1: 60
  y0: -45
  y1: 45
  district:
    - [-90, -75]
    - [90, -75]
    - [90, 75]
    - [-90, 75]
  hero_anchor: [0, -18]
  silhouette:
    origin: [-60, 0]
    axis: [1, 0]
    length: 120
    samples: [46, 74, 176, 98, 50]
    mode: soft_max
  # class, oneway, lanes, core. core is the downtown section: wide paved walk, tree grates.
  streets:
    south:
      class: major
      oneway: true
      lanes: 3
      core: true
      name: South Avenue
    north:
      class: mid
      oneway: false
      lanes: 2
      core: false
      name: North Avenue
    east:
      class: minor
      oneway: true
      lanes: 1
      core: true
      name: East Street
    west:
      class: major
      oneway: true
      lanes: 3
      core: true
      name: West Avenue
