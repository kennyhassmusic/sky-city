# Building grammar. One style tag picks massing, openings and materials.
#
# The evaluator in grammar.py is the shape grammar: lot, then mass (extrude, setbacks,
# podium and tower), then floors and bays, then the roof. Numbers here are the rules an
# artist edits. Materials are names of CC0 slots (brick, concrete, plaster, metal, glass),
# not file paths.

