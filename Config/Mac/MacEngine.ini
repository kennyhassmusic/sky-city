; Sky City on Macs. M1-generation GPUs can't run Nanite (Metal falls back to SM5), so the City Sample
; buildings draw as their LOD meshes; these settings keep the 2.2M-instance city flyable there.
; Nanite-capable PCs and Macs are unaffected by r.ForceLOD (Nanite meshes ignore it).
[SystemSettings]
r.ForceLOD=1
r.VolumetricCloud=0
r.AntiAliasingMethod=2
r.MotionBlurQuality=0
r.ScreenPercentage=70
sg.PostProcessQuality=1
; GPU occlusion culling for instanced meshes: most City Sample modules are hidden behind nearer buildings
r.InstanceCulling.OcclusionCull=1
; three sun shadow cascades instead of ten, and skip shadows from tiny details
r.Shadow.CSM.MaxCascades=3
r.Shadow.RadiusThreshold=0.06
