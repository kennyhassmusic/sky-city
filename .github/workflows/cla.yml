# CLA check: the first time someone opens a pull request, a bot asks them to sign CLA.md by replying with
# "I have read the CLA Document and I hereby sign the CLA". Signatures are kept in signatures/cla.json on the
# cla-signatures branch. The action never checks out or runs pull-request code; it is pinned to a full commit.
name: CLA
on:
  issue_comment:
    types: [created]
  pull_request_target:
    types: [opened, closed, synchronize]
permissions:
  actions: write
  contents: write
  pull-requests: write
  statuses: write
jobs:
  cla:
    runs-on: ubuntu-latest
    if: (github.event.comment.body == 'recheck' || github.event.comment.body == 'I have read the CLA Document and I hereby sign the CLA') || github.event_name == 'pull_request_target'
    steps:
      - name: CLA Assistant
        uses: contributor-assistant/github-action@ca4a40a7d1004f18d9960b404b97e5f30a505a08 # v2.6.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          path-to-signatures: signatures/cla.json
          path-to-document: https://github.com/kennyhassmusic/sky-city/blob/main/CLA.md
          branch: cla-signatures
          allowlist: kennyhassmusic,dependabot[bot],cursoragent
          custom-notsigned-prcomment: >-
            Thanks for contributing to Sky City! Before we can merge this, please read the
            [Contributor License Agreement](https://github.com/kennyhassmusic/sky-city/blob/main/CLA.md)
            and sign it by replying with the sentence below. You only do this once.
